# Tabla 34 · PostgreSQL 18, único almacén: datos de negocio, cola de trabajos y
# mecanismo de publicación y suscripción sobre la misma base de datos (D-08).
# Tabla 41 · el valor propio de cada instalación se provee por DATABASE_URL (RNF-19), sin
# valor por omisión escrito en el repositorio. La base de pruebas es la misma cadena con
# el sufijo _prueba en el nombre.
<% principal = ENV.fetch("DATABASE_URL") %>
<% prueba = URI.parse(principal).tap { |u| u.path = "#{u.path}_prueba" }.to_s %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  url: <%= principal %>

test:
  <<: *default
  url: <%= prueba %>

production:
  <<: *default
  url: <%= principal %>
