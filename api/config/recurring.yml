# RNF-07 · la bitácora de fallos de envío se conserva doce meses (Tabla 30,
# RETENCION_BITACORA_MESES). La composición corre en development y la instalación en
# production: la purga se declara en los dos.
development:
  purga_de_bitacora:
    class: PurgaDeBitacoraJob
    schedule: every day at 3am

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purga_de_bitacora:
    class: PurgaDeBitacoraJob
    schedule: every day at 3am
