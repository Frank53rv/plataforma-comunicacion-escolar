# Tabla 23 · ActionCable con adaptador Solid Cable, respaldado por la misma base de
# datos y sin almacén en memoria adicional. Sin conexión propia: usa la principal.
default: &default
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

test:
  adapter: test

production:
  <<: *default
