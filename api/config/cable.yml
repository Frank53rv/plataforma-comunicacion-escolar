# Tabla 34 · ActionCable con adaptador Solid Cable, respaldado por la misma base de
# datos y sin almacén en memoria adicional.
default: &default
  adapter: solid_cable
  connects_to:
    database:
      writing: primary
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

test:
  adapter: test

production:
  <<: *default
