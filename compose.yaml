# Tabla 45 · Matriz de infraestructura. Tres unidades de ejecución propias; el túnel de
# exposición corre como proceso auxiliar junto a esta composición y el servicio de
# notificaciones push es el único componente externo.
# RNF-19 · el entorno completo se levanta desde el repositorio sin edición manual de
# ningún archivo: los valores propios de la instalación vienen de .env (Tabla 41).

name: plataforma-comunicacion-escolar

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma_desarrollo
    volumes:
      # PostgreSQL 18 ubica los datos en un subdirectorio de este punto de montaje
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma_desarrollo"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: ./api
    env_file: .env
    environment:
      RAILS_ENV: development
    volumes:
      - ./api:/api
      - gemas:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "3000:3000"

  cliente:
    build: ./cliente
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8080:80"

volumes:
  datos_postgres:
  gemas:
