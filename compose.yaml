# Tabla 34 · Matriz de infraestructura. Tres unidades de ejecución propias; el túnel de
# exposición corre como proceso auxiliar junto a esta composición y el servicio de
# notificaciones push es el único componente externo.
# RNF-19 · el entorno completo se levanta desde el repositorio sin edición manual de
# ningún archivo: los valores propios de la instalación vienen de .env (Tabla 30).

name: plataforma-comunicacion-escolar

services:
  db:
    image: postgres:18
    # Tabla 30 · las credenciales del motor son las de DATABASE_URL y ninguna otra: el
    # contenedor las toma de esa misma cadena, de modo que no hace falta una variable
    # que la tabla no enumere ni queda una credencial escrita en este archivo.
    env_file: .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_USER="$$(echo "$$DATABASE_URL" | sed -E 's#^[a-z]+://([^:]+):.*#\1#')"
        export POSTGRES_PASSWORD="$$(echo "$$DATABASE_URL" | sed -E 's#^[a-z]+://[^:]+:([^@]+)@.*#\1#')"
        export POSTGRES_DB="$$(echo "$$DATABASE_URL" | sed -E 's#^.*/([^/?]+)([?].*)?$$#\1#')"
        exec docker-entrypoint.sh postgres
    volumes:
      # PostgreSQL 18 ubica los datos en un subdirectorio de este punto de montaje
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin puertos hacia el equipo: la base sólo es alcanzable desde la red privada de la
    # composición. La Tabla 34 no la expone.

  api:
    build: ./api
    env_file: .env
    environment:
      RAILS_ENV: development
    volumes:
      # Sólo el código. Las gemas viven en la imagen, resueltas desde Gemfile.lock:
      # un volumen sobre BUNDLE_PATH enmascararía la instalación de la imagen y haría
      # que el entorno dependiera de su historia y no del repositorio (RNF-19).
      - ./api:/api
      # El paquete normativo, de sólo lectura: la suite contrasta la matriz de
      # autorización contra la columna de roles de la Tabla 18 (RNF-01) y no contra
      # una lista escrita a mano.
      - ./specs:/specs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Boundary 4 · sin ruta de salud propia: se comprueba con una operación del
      # inventario, que sin token debe responder 401 (Tabla 35).
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:3000/api/v1/sesiones)\" = 401"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "3000:3000"

  cliente:
    build:
      context: ./cliente
      args:
        VITE_FCM_API_KEY: ${VITE_FCM_API_KEY:-}
        VITE_FCM_PROJECT_ID: ${VITE_FCM_PROJECT_ID:-}
        VITE_FCM_SENDER_ID: ${VITE_FCM_SENDER_ID:-}
        VITE_FCM_APP_ID: ${VITE_FCM_APP_ID:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8080:80"

volumes:
  datos_postgres:
