# Tabla 23 · nginx entrega los archivos producidos por la construcción del cliente y
# reenvía a la interfaz de programación las peticiones REST y el canal de tiempo real,
# de modo que el entorno se expone con un único dominio (APP_HOST, Tabla 30). La
# terminación de la conexión cifrada la provee el túnel (Tabla 34, RNF-06).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # RF-25 · Tabla 29 · WSS /cable: la conexión persistente requiere el cambio de
    # protocolo.
    location /cable {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1h;
    }

    # Tabla 18 · la interfaz versionada.
    location /api/v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # El cliente es una aplicación de una sola página: toda ruta desconocida
    # devuelve el documento de entrada y el enrutamiento se resuelve en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
