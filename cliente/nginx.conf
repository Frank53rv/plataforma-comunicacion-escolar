# Tabla 34 · nginx entrega los archivos producidos por la construcción del cliente.
# La terminación de la conexión cifrada la provee el túnel de la Tabla 45 (RNF-06).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El cliente es una aplicación de una sola página: toda ruta desconocida
    # devuelve el documento de entrada y el enrutamiento se resuelve en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
