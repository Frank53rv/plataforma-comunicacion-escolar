components:
  securitySchemes:
    portador:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Tabla 39 · encabezado de autorización con el esquema de portador y el token de
        RF-01. La conexión del canal de tiempo real presenta el mismo token.

  responses:
    NoAutenticado:
      description: >-
        Credencial inválida, cuenta dada de baja, token ausente, expirado o alterado
        (Tabla 35 · CU-01 E1 y E2 · RNF-02). El mensaje no distingue cuál de los dos
        datos falló.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoHabilitado:
      description: >-
        Autenticado pero no habilitado: credencial provisional sin cambiar, rol sin la
        atribución, docente no vinculado al curso, anuncio del que no es autor,
        participación en conversación ajena, o supervisión que no habilita emitir
        (Tabla 35).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: Recurso ajeno a las vinculaciones de quien consulta (Tabla 35 · CU-09 E1).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    CodigoNoVigente:
      description: Código de activación vencido, ya utilizado o inexistente (Tabla 35 · CU-02 E1).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    AdjuntoDemasiadoGrande:
      description: Archivo adjunto que supera los 5 MB (Tabla 35 · RN-33).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    FormatoNoAdmitido:
      description: Archivo adjunto en un formato distinto de PDF (Tabla 35 · RN-33).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    DatosInaceptables:
      description: >-
        Petición bien formada con datos inaceptables, incluida la publicación con más
        de tres adjuntos (Tabla 35 · RN-33 y validaciones de forma).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ErrorInterno:
      description: >-
        Fallo no previsto, registrado en la bitácora sin exponer detalle interno
        (Tabla 35 · Boundary 6).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    Problema:
      type: object
      description: >-
        Tabla 39 · objeto conforme a RFC 9457 con los miembros de la norma más «codigo»
        y «regla», según el catálogo de la Tabla 35. Ningún cuerpo de error revela
        detalle interno.
      required: [type, title, status, detail, codigo]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        codigo: { type: string }
        regla:
          type: string
          description: Código de la regla de negocio en conflicto, presente sólo en el 409.
          examples: [RN-31]

    Paginacion:
      type: object
      required: [total, pagina, por_pagina]
      properties:
        total: { type: integer }
        pagina: { type: integer }
        por_pagina: { type: integer }

    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, maxLength: 80 }
        apellido: { type: string, maxLength: 80 }
        correo: { type: string, format: email }
        rol: { type: string, enum: [directivo, docente, tutor, alumno] }
        estado: { type: string, enum: [pendiente, activo, dado_de_baja] }
        credencial_provisional: { type: boolean }
        creado_en: { type: string, format: date-time }

    Sesion:
      type: object
      description: RF-01 · token firmado que transporta la identidad y el rol.
      required: [token, vence_en, usuario]
      properties:
        token: { type: string }
        vence_en: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/Usuario' }

    CodigoActivacion:
      type: object
      description: >-
        El código en claro no figura acá: la entidad almacena su derivación y no el
        valor, del mismo modo que la contraseña (nota de la Tabla 40 · RN-06 · RNF-03).
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        vence_en: { type: string, format: date-time }

    CodigoActivacionEnClaro:
      allOf:
        - $ref: '#/components/schemas/CodigoActivacion'
        - type: object
          description: >-
            El código se devuelve en claro una sola vez, en la respuesta de la operación
            que lo genera o regenera, y no vuelve a ser recuperable (nota de la Tabla 40 ·
            D-10). Forma LLLLLLLL-SSSSSSSS (D-11).
          properties:
            codigo: { type: string }

    AltaDePersona:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        codigo_activacion: { $ref: '#/components/schemas/CodigoActivacionEnClaro' }

    AltaDeAlumno:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        alumno_curso: { $ref: '#/components/schemas/AlumnoCurso' }
        codigo_activacion: { $ref: '#/components/schemas/CodigoActivacionEnClaro' }

    AltaDeTutor:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        tutor_alumno: { $ref: '#/components/schemas/TutorAlumno' }
        codigo_activacion: { $ref: '#/components/schemas/CodigoActivacionEnClaro' }

    AnioLectivo:
      type: object
      properties:
        id: { type: string, format: uuid }
        anio: { type: integer }
        estado: { type: string, enum: [vigente, cerrado] }
        abierto_en: { type: string, format: date-time }
        cerrado_en: { type: string, format: date-time, nullable: true }

    Curso:
      type: object
      properties:
        id: { type: string, format: uuid }
        anio_lectivo_id: { type: string, format: uuid }
        nombre: { type: string, maxLength: 60 }
        turno: { type: string, maxLength: 20 }
        estado: { type: string, enum: [vigente, archivado] }
        alumnos_vinculados:
          type: integer
          description: Cantidad de alumnos vinculados (Tabla 40, GET /cursos).

    DocenteCurso:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        curso_id: { type: string, format: uuid }
        es_titular: { type: boolean }
        vigente_desde: { type: string, format: date }
        vigente_hasta: { type: string, format: date, nullable: true }

    AlumnoCurso:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        curso_id: { type: string, format: uuid }
        vigente_desde: { type: string, format: date }
        vigente_hasta: { type: string, format: date, nullable: true }

    TutorAlumno:
      type: object
      properties:
        id: { type: string, format: uuid }
        tutor_id: { type: string, format: uuid }
        alumno_id: { type: string, format: uuid }
        vigente_desde: { type: string, format: date }
        vigente_hasta: { type: string, format: date, nullable: true }

    AnuncioVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        anuncio_id: { type: string, format: uuid }
        numero_version: { type: integer }
        titulo: { type: string, maxLength: 160 }
        cuerpo: { type: string }
        publicado_en: { type: string, format: date-time, nullable: true }

    Anuncio:
      type: object
      properties:
        id: { type: string, format: uuid }
        autor_id: { type: string, format: uuid }
        estado: { type: string, enum: [borrador, programado, publicado, archivado, eliminado] }
        programado_para: { type: string, format: date-time, nullable: true }
        creado_en: { type: string, format: date-time }

    AnuncioPublicado:
      allOf:
        - $ref: '#/components/schemas/Anuncio'
        - type: object
          properties:
            anuncio_version: { $ref: '#/components/schemas/AnuncioVersion' }
            destinatarios_resueltos:
              type: integer
              description: >-
                RF-21 · cantidad de destinatarios resueltos en la publicación efectiva,
                no en la redacción.

    AnuncioEliminado:
      allOf:
        - $ref: '#/components/schemas/Anuncio'
        - type: object
          properties:
            eliminado_en: { type: string, format: date-time }
            eliminado_por: { type: string, format: uuid }

    AnuncioEnBandeja:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        publicado_en: { type: string, format: date-time }
        autor: { $ref: '#/components/schemas/Usuario' }
        leido:
          type: boolean
          description: Estado de lectura de quien consulta (Tabla 40, GET /anuncios).

    Adjunto:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, maxLength: 160 }
        tipo_mime: { type: string, enum: [application/pdf] }
        tamano: { type: integer, maximum: 5242880 }

    AnuncioDetalle:
      allOf:
        - $ref: '#/components/schemas/Anuncio'
        - type: object
          properties:
            version: { $ref: '#/components/schemas/AnuncioVersion' }
            cursos:
              type: array
              items: { $ref: '#/components/schemas/Curso' }
            adjuntos:
              type: array
              items: { $ref: '#/components/schemas/Adjunto' }

    Constancias:
      type: object
      description: >-
        RN-21 · el docente ve cuántos leyeron sobre el total y la nómina de quiénes no.
        La nómina devuelve el nombre del alumno y el estado de lectura de su familia,
        pero no el de cada tutor por separado (nota de la Tabla 40).
      properties:
        total_destinatarios: { type: integer }
        con_lectura_registrada: { type: integer }
        sin_lectura:
          type: array
          items:
            type: object
            properties:
              alumno:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  apellido: { type: string }
              familia_alcanzada:
                type: boolean
                description: >-
                  RF-38 · derivado: al menos uno de los tutores del alumno registró
                  lectura de la publicación vigente. Should have.

    EntregaAnuncio:
      type: object
      properties:
        id: { type: string, format: uuid }
        anuncio_version_id: { type: string, format: uuid }
        destinatario_id: { type: string, format: uuid }
        canal: { type: string, enum: [push, aplicacion] }
        enviada_en: { type: string, format: date-time }
        entregada_en: { type: string, format: date-time, nullable: true }
        vista_en: { type: string, format: date-time, nullable: true }
        leida_en: { type: string, format: date-time, nullable: true }
        causa_fallo:
          type: string
          nullable: true
          enum: [servicio_no_disponible, sin_acuse_del_cliente, navegador_sin_soporte, credencial_invalida]

    RegistroEnLote:
      type: object
      description: >-
        RF-36 · la reemisión de un evento ya registrado no altera la marca de tiempo
        original y responde igual que la primera vez.
      properties:
        registrada: { type: integer }
        omitida_por_idempotencia: { type: integer }

    Panel:
      type: object
      description: RF-40 · panel del rol autenticado, sin exponer opciones ajenas a él.
      properties:
        rol: { type: string, enum: [directivo, docente, tutor, alumno] }
        nombre: { type: string }
        opciones_habilitadas:
          type: array
          items: { type: string }
        anuncios_sin_leer: { type: integer }

    EstadoPorCurso:
      type: object
      description: RF-45 · estado agregado de entrega y lectura por curso.
      properties:
        curso: { $ref: '#/components/schemas/Curso' }
        anuncios: { type: integer }
        enviadas: { type: integer }
        entregadas: { type: integer }
        vistas: { type: integer }
        leidas: { type: integer }

    Conversacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        curso_id: { type: string, format: uuid }
        tipo: { type: string, enum: [grupal_tutores, grupal_alumnos, privada] }
        estado: { type: string, enum: [activa, solo_lectura] }

    Mensaje:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversacion_id: { type: string, format: uuid }
        autor: { $ref: '#/components/schemas/Usuario' }
        cuerpo: { type: string }
        enviado_en: { type: string, format: date-time }

    ConversacionConNoLeidos:
      allOf:
        - $ref: '#/components/schemas/Conversacion'
        - type: object
          properties:
            ultimo_mensaje: { $ref: '#/components/schemas/Mensaje' }
            no_leidos:
              type: integer
              description: RF-47 · mensajes posteriores al puntero de lectura. Should have.

    PunteroLectura:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversacion_id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        ultimo_mensaje_id: { type: string, format: uuid, nullable: true }
        actualizado_en: { type: string, format: date-time }
        no_leidos_restantes: { type: integer }

    Preferencia:
      type: object
      description: >-
        RF-33 · horario de disponibilidad y preferencias de recepción de los mensajes de
        conversación. Los anuncios institucionales no están alcanzados por esta
        configuración (RN-18). Las horas son de pared y se interpretan en la zona
        America/Asuncion (punto 4.2).
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        hora_inicio: { type: string, examples: ['22:00'] }
        hora_fin: { type: string, examples: ['07:00'] }
        recibir_mensajes: { type: boolean }

    SuscripcionPush:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        navegador: { type: string, maxLength: 80 }
        estado: { type: string, enum: [vigente, invalida] }
        creada_en: { type: string, format: date-time }
        invalidada_en: { type: string, format: date-time, nullable: true }
