# GENERADO desde specs/20-endpoints.json (Tabla 27), las convenciones de la Tabla 39
# y las formas de la Tabla 40. RNF-17 · CP-RNF-17.
#
# La verificación consiste en contrastar las rutas del enrutador contra las de este
# archivo y contra el inventario de la Tabla 27, con diferencia nula en los tres
# sentidos. La compuerta `contrato` de bin/verificar lo comprueba.
openapi: 3.1.0
info:
  title: API REST de un colegio para una plataforma de comunicación escolar
  version: 1.0.0
  description: |
    Interfaz de programación del producto mínimo viable. Cuarenta y dos operaciones
    sobre HTTP más el canal de tiempo real, derivadas de los quince casos de uso de la
    Tabla 20.

    El canal de tiempo real no figura entre las rutas de este archivo por no ser una
    operación HTTP: se establece en `WSS /cable`, presentando el mismo token de
    portador en el parámetro de conexión, con `canal` y `conversacion_id` en la
    suscripción. Realiza RF-25, RF-29 y RF-32 para docente, tutor y alumno (CU-12).

    Convenciones de la Tabla 39 aplicadas a la totalidad de las operaciones:
    identificador universal único en rutas y cuerpos; JSON en petición y respuesta con
    nombres de campo iguales a los del diccionario de la Tabla 21; fechas conforme a
    ISO 8601 con desplazamiento explícito, almacenadas y respondidas en tiempo
    universal coordinado; paginación con `pagina` y `por_pagina`, veinticinco por
    omisión y cien como máximo; cuerpo de petición de hasta 1 MB, salvo la carga de
    adjuntos, limitada a 5 MB por archivo.

    El catálogo de errores es cerrado: ninguna operación emite un estado fuera de los
    nueve de la Tabla 35.
servers:
  - url: https://{host}/api/v1
    description: Entorno de demostración expuesto por túnel con certificado válido
    variables:
      host:
        default: localhost
        description: Valor de APP_HOST (Tabla 41)
security:
  - portador: []
paths:
  /sesiones:
    post:
      operationId: post_sesiones
      summary: Autenticar y emitir el token
      description: >-
        CU-01 · RF-01. Roles autorizados: Sin autenticar.
      tags: [CU-01]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo:
                  type: string
                contrasena:
                  type: string
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      operationId: delete_sesiones
      summary: Cerrar la sesión activa
      description: >-
        CU-01 · RF-01. Roles autorizados: Directivo, docente, tutor, alumno.
      tags: [CU-01]
      responses:
        '204':
          description: Sin cuerpo
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /activaciones:
    post:
      operationId: post_activaciones
      summary: Canjear el código y definir la contraseña
      description: >-
        CU-02 · RF-06. Roles autorizados: Sin autenticar.
      tags: [CU-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, contrasena]
              properties:
                codigo:
                  type: string
                contrasena:
                  type: string
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '410': { $ref: '#/components/responses/CodigoNoVigente' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /recuperaciones:
    post:
      operationId: post_recuperaciones
      summary: Restablecer el acceso mediante código regenerado
      description: >-
        CU-02 · RF-08. Roles autorizados: Sin autenticar. · Should have, fuera del alcance comprometido: RF-08
      tags: [CU-02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, contrasena]
              properties:
                codigo:
                  type: string
                contrasena:
                  type: string
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '410': { $ref: '#/components/responses/CodigoNoVigente' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /usuarios/me/contrasena:
    patch:
      operationId: patch_usuarios_me_contrasena
      summary: Sustituir la credencial provisional
      description: >-
        CU-02 · RF-43. Roles autorizados: Directivo, docente, tutor, alumno.
      tags: [CU-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena_actual, contrasena_nueva]
              properties:
                contrasena_actual:
                  type: string
                contrasena_nueva:
                  type: string
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /anios-lectivos:
    post:
      operationId: post_anios_lectivos
      summary: Crear el año lectivo
      description: >-
        CU-03 · RF-11. Roles autorizados: Directivo.
      tags: [CU-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio*]
              properties:
                anio:
                  type: integer
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnioLectivo" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '409':
          description: RN-31 · ya existe un año lectivo vigente (CU-03 E1)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    get:
      operationId: get_anios_lectivos
      summary: Consultar los años lectivos
      description: >-
        CU-03 · RF-11. Roles autorizados: Directivo.
      tags: [CU-03]
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginacion"
                  - type: object
                    properties:
                      datos:
                        type: array
                        items: { $ref: "#/components/schemas/AnioLectivo" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /anios-lectivos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: patch_anios_lectivos_id
      summary: Cerrar el año lectivo
      description: >-
        CU-03 · RF-16. Roles autorizados: Directivo. · Should have, fuera del alcance comprometido: RF-16
      tags: [CU-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnioLectivo" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /cursos:
    post:
      operationId: post_cursos
      summary: Crear un curso del año lectivo vigente
      description: >-
        CU-03 · RF-12. Roles autorizados: Directivo.
      tags: [CU-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio_lectivo_id*, nombre, turno]
              properties:
                anio_lectivo_id:
                  type: string
                  format: uuid
                nombre:
                  type: string
                turno:
                  type: string
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curso" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '409':
          description: nombre de curso repetido en el mismo año lectivo (CU-03 E2)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    get:
      operationId: get_cursos
      summary: Consultar los cursos
      description: >-
        CU-03, CU-09 · RF-12. Roles autorizados: Directivo, docente.
      tags: [CU-03, CU-09]
      parameters:
        - name: anio_lectivo_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: estado
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginacion"
                  - type: object
                    properties:
                      datos:
                        type: array
                        items: { $ref: "#/components/schemas/Curso" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /cursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: patch_cursos_id
      summary: Editar un curso
      description: >-
        CU-03 · RF-12. Roles autorizados: Directivo.
      tags: [CU-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                turno:
                  type: string
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curso" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /docentes:
    post:
      operationId: post_docentes
      summary: Dar de alta a un docente y generar su código
      description: >-
        CU-04 · RF-03, RF-05. Roles autorizados: Directivo.
      tags: [CU-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, correo]
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                correo:
                  type: string
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AltaDePersona" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /cursos/{id}/docentes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: post_cursos_id_docentes
      summary: Vincular un docente al curso con su atributo de titularidad
      description: >-
        CU-04 · RF-15. Roles autorizados: Directivo.
      tags: [CU-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario_id*, es_titular*]
              properties:
                usuario_id:
                  type: string
                  format: uuid
                es_titular:
                  type: boolean
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocenteCurso" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /cursos/{id}/docentes/{usuarioId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: usuarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: delete_cursos_id_docentes_usuarioId
      summary: Desvincular al docente designando otro titular
      description: >-
        CU-04 · RF-44. Roles autorizados: Directivo.
      tags: [CU-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titular_reemplazo_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocenteCurso" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: RN-13 · el titular se desvincula sin designar reemplazo (CU-04 E1)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /docentes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: delete_docentes_id
      summary: Dar de baja lógica a un docente
      description: >-
        CU-04 · RF-44. Roles autorizados: Directivo.
      tags: [CU-04]
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /usuarios/{id}/codigos-activacion:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: post_usuarios_id_codigos_activacion
      summary: Regenerar el código de activación
      description: >-
        CU-04, CU-05 · RF-07. Roles autorizados: Directivo (docentes), docente (alumnos, tutores).
      tags: [CU-04, CU-05]
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodigoActivacionEnClaro" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /alumnos:
    post:
      operationId: post_alumnos
      summary: Dar de alta a un alumno y vincularlo a un curso
      description: >-
        CU-05 · RF-04, RF-05, RF-13. Roles autorizados: Docente.
      tags: [CU-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, correo, curso_id*]
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                correo:
                  type: string
                curso_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AltaDeAlumno" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '409':
          description: RN-30 · el alumno ya pertenece a un curso vigente del año (CU-05 E2)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /alumnos/{id}/tutores:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: post_alumnos_id_tutores
      summary: Vincular un tutor al alumno
      description: >-
        CU-05 · RF-04, RF-05, RF-14. Roles autorizados: Docente.
      tags: [CU-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, correo]
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                correo:
                  type: string
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AltaDeTutor" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: RN-29 · el alumno ya tiene dos tutores vigentes (CU-05 E1)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /alumnos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: delete_alumnos_id
      summary: Dar de baja lógica a un alumno
      description: >-
        CU-05 · RF-09. Roles autorizados: Directivo, docente titular.
      tags: [CU-05]
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /tutores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: delete_tutores_id
      summary: Dar de baja lógica a un tutor
      description: >-
        CU-05 · RF-09, RF-10. Roles autorizados: Directivo, docente titular.
      tags: [CU-05]
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: RN-12 · el tutor mantiene al menos un alumno activo (CU-05 E3)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /anuncios:
    post:
      operationId: post_anuncios
      summary: Publicar un anuncio de forma inmediata o programada
      description: >-
        CU-06 · RF-17, RF-18, RF-21, RF-31. Roles autorizados: Docente. · Should have, fuera del alcance comprometido: RF-18
      tags: [CU-06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, cuerpo, cursos*]
              properties:
                titulo:
                  type: string
                cuerpo:
                  type: string
                cursos:
                  type: array
                  items: { type: string, format: uuid }
                programado_para:
                  type: string
                  format: date-time
                adjuntos:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnuncioPublicado" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoHabilitado' }
        '422': { $ref: '#/components/responses/DatosInaceptables' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    get:
      operationId: get_anuncios
      summary: Consultar el historial filtrado por fecha, curso y remitente
      description: >-
        CU-09 · RF-22, RF-39. Roles autorizados: Directivo, docente, tutor, alumno.
      tags: [CU-09]
      parameters:
        - name: curso_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: remitente_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Operación completada
          content:
